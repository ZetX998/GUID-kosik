<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GUID Admin – Správa aplikace</title>
    <link rel="stylesheet" href="css/style.css?v=20261111">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="auth-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg-main); z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px;">
        <div class="guide-step" style="max-width:360px; width:100%; text-align:center;">
            <h3 style="margin-bottom: 10px;"><i class="fa-solid fa-lock" style="color:var(--brand-green);"></i> Admin Přihlášení</h3>
            <p style="margin-bottom:15px; color:var(--text-muted); font-size:0.85rem;">Zadejte heslo pro správu obsahu aplikace.</p>
            <input type="password" id="admin-pass" class="input-field" placeholder="Zadejte heslo" style="margin-bottom:15px;">
            <button class="btn-confirm" onclick="checkAdminAuth()">Přihlásit se</button>
        </div>
    </div>

    <div class="app-container" id="admin-main-container" style="display:none;">
        <header>
            <div class="logo"><i class="fa-solid fa-cart-shopping"></i> GUID <span>Admin</span></div>
            <div class="header-actions">
                <button class="btn-top-action" onclick="previewDraft()"><i class="fa-solid fa-eye"></i> Náhled</button>
                <button class="btn-top-action" onclick="publishAll()" style="background:var(--brand-green); color:#fff; border-color:var(--brand-green);"><i class="fa-solid fa-rocket"></i> Uložit</button>
                <button class="btn-top-action" onclick="logoutAdmin()" style="background:#EF4444; color:#fff; border-color:#EF4444;"><i class="fa-solid fa-right-from-bracket"></i> Odhlásit</button>
            </div>
        </header>

        <div class="main-content">
            <div class="guide-step" style="margin-bottom: 20px;">
                <h4 style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <span><i class="fa-solid fa-envelope-open-text"></i> Hlášení od kurýrů</span>
                    <span id="reports-badge" style="background: var(--brand-green); color: #fff; font-size: 0.75rem; padding: 2px 8px; border-radius: 10px;">0</span>
                </h4>
                <div id="admin-reports" style="margin-top: 10px; max-height: 180px; overflow-y: auto;">
                    <p style="color: var(--text-muted); font-size: 0.85rem;">Zatím žádná hlášení.</p>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <h3 style="font-size: 0.95rem; font-weight: 700;"><i class="fa-solid fa-table-cells"></i> Správa dlaždic</h3>
                <button class="btn-top-action" style="background:var(--brand-green); color:#fff; border-color:var(--brand-green);" onclick="addNewCategoryModal()"><i class="fa-solid fa-plus"></i> Přidat dlaždici</button>
            </div>

            <div class="grid-container" id="admin-grid"></div>
        </div>

        <footer>
            <p>GUID Admin Panel &copy; 2026</p>
        </footer>
    </div>

    <div id="edit-modal" class="view-screen" style="display:none;">
        <div class="view-header">
            <button class="btn-back" onclick="closeEditModal()"><i class="fa-solid fa-arrow-left"></i> Zpět</button>
            <h2 id="edit-modal-title" style="font-size: 0.95rem; color: var(--brand-green); font-weight: 700; text-align: center;">Úprava sekce</h2>
            <button class="btn-close" onclick="closeEditModal()">✕</button>
        </div>
        <div id="edit-modal-body" style="padding-bottom: 60px; margin-top: 10px;"></div>
    </div>

    <script>
        document.write('<script src="js/data.js?v=' + Date.now() + '"><\/script>');
        document.write('<script src="js/admin.js?v=' + Date.now() + '"><\/script>');
    </script>
</body>
</html>
