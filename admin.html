<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GUID Admin - Správa</title>
    <link rel="stylesheet" href="css/style.css?v=20261111">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <!-- Přihlášení -->
    <div id="auth-overlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg-main);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;">
        <div class="guide-step" style="max-width:360px;width:100%;text-align:center;">
            <h3><i class="fa-solid fa-lock"></i> Admin Přihlášení</h3>
            <p style="margin-bottom:15px;color:var(--text-secondary);font-size:0.85rem;">Zadejte heslo pro správu aplikace.</p>
            <input type="password" id="admin-pass" class="input-field" placeholder="Zadejte heslo" style="margin-bottom:15px;">
            <button class="btn-confirm" onclick="checkAdminAuth()">Přihlásit se</button>
        </div>
    </div>

    <!-- Hlavní admin kontejner -->
    <div class="app-container" id="admin-main-container" style="display:none;">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <div class="logo"><i class="fa-solid fa-cart-shopping"></i> GUID <span>Admin</span></div>
            <div class="header-actions" style="display: flex; gap: 8px;">
                <button class="btn-back" onclick="previewDraft()" style="padding: 6px 12px; font-size: 0.85rem;"><i class="fa-solid fa-eye"></i> Náhled</button>
                <button id="btn-pub" class="btn-confirm" onclick="publishAll()" style="padding: 6px 12px; font-size: 0.85rem; margin:0;"><i class="fa-solid fa-rocket"></i> Publikovat</button>
            </div>
        </header>

        <div class="main-content">
            <!-- Hlášení od kurýrů (v mřížkovém pojetí) -->
            <div class="guide-step" style="margin-bottom: 20px;">
                <h4 style="display: flex; justify-content: space-between; align-items: center;">
                    <span><i class="fa-solid fa-envelope-open-text"></i> Hlášení od kurýrů</span>
                    <span id="reports-badge" style="background: var(--brand-green); color: #000; font-size: 0.75rem; padding: 2px 8px; border-radius: 10px;">0</span>
                </h4>
                <div id="admin-reports" style="margin-top: 10px; max-height: 220px; overflow-y: auto;">
                    <p style="color: var(--text-secondary); font-size: 0.85rem;">Zatím žádná hlášení.</p>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="font-size: 1.05rem;"><i class="fa-solid fa-table-cells"></i> Správa mřížky & Sekcí</h3>
                <button class="btn-confirm" style="font-size:0.75rem; padding:4px 10px; margin:0;" onclick="addNewCategoryModal()"><i class="fa-solid fa-plus"></i> Přidat dlaždici</button>
            </div>

            <div class="grid-container" id="admin-grid"></div>
        </div>
    </div>

    <!-- Modální editor -->
    <div id="edit-modal" class="view-screen" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:10000; background:var(--bg-dark); overflow-y:auto; padding: 16px;">
        <div class="view-header" style="position:sticky; top:0; background:var(--bg-dark); padding-bottom:10px; z-index:10;">
            <button class="btn-back" onclick="closeEditModal()"><i class="fa-solid fa-arrow-left"></i> Zpět</button>
            <h2 id="edit-modal-title" style="font-size: 0.95rem; color: var(--brand-green-bright);">Úprava sekce</h2>
            <button class="btn-close" onclick="closeEditModal()">✕</button>
        </div>
        <div id="edit-modal-body" style="padding-bottom: 40px;"></div>
    </div>

    <script>
        document.write('<script src="js/firebase-config.js?v=' + Date.now() + '"><\/script>');
        document.write('<script src="js/data.js?v=' + Date.now() + '"><\/script>');
        document.write('<script src="js/admin.js?v=' + Date.now() + '"><\/script>');
    </script>
</body>
</html>
