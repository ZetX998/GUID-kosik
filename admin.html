<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GUID Admin - Správa</title>
    <link rel="stylesheet" href="css/style.css?v=20261111">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <!-- Přihlašovací overlay -->
    <div id="auth-overlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg-main, #090D16);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;">
        <div class="guide-step" style="max-width:360px;width:100%;text-align:center;">
            <h3>🔒 Admin Přihlášení</h3>
            <p style="margin-bottom:15px;color:var(--text-secondary, #94A3B8);">Zadejte heslo pro správu aplikace GUID Kurýr.</p>
            <input type="password" id="admin-pass" class="input-field" placeholder="Zadejte heslo" style="margin-bottom:15px;">
            <button class="btn-confirm" onclick="checkAdminAuth()">Přihlásit se</button>
        </div>
    </div>

    <!-- Hlavní administrační kontejner -->
    <div class="app-container" id="admin-main-container" style="display:none;">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <div class="logo" onclick="location.href='index.html'">🛒 GUID <span>Admin</span></div>
            <div class="header-actions" style="display: flex; gap: 8px;">
                <button class="btn-back" onclick="previewDraft()" style="padding: 6px 12px; font-size: 0.85rem;">👁️ Náhled</button>
                <button id="btn-pub" class="btn-confirm" onclick="publishAll()" style="padding: 6px 12px; font-size: 0.85rem; margin:0;">🚀 Publikovat</button>
            </div>
        </header>

        <div class="main-content">
            <div id="status-msg" style="padding: 10px; margin-bottom: 12px; border-radius: 8px; font-size: 0.9rem; display: none;"></div>

            <!-- Sekce hlášení od kurýrů -->
            <div class="guide-step" style="margin-bottom: 16px;">
                <h4 style="display: flex; justify-content: space-between; align-items: center;">
                    <span>📩 Hlášení od kurýrů</span>
                    <span id="reports-badge" style="background: var(--brand-green, #00A046); color: #000; font-size: 0.75rem; padding: 2px 8px; border-radius: 10px;">0</span>
                </h4>
                <div id="admin-reports" style="margin-top: 10px; max-height: 200px; overflow-y: auto;">
                    <p style="color: var(--text-secondary, #94A3B8); font-size: 0.9rem;">Zatím žádná hlášení od kurýrů.</p>
                </div>
            </div>

            <h3 style="margin-bottom: 12px; font-size: 1.1rem; color: var(--text-main, #F8FAFC);">📊 Mřížka sekcí & Statistiky</h3>
            <p style="color: var(--text-secondary, #94A3B8); font-size: 0.85rem; margin-bottom: 15px;">Kliknutím na dlaždici otevřete editor obsahu.</p>

            <!-- Mřížka sekcí v adminu -->
            <div class="grid-container" id="admin-grid"></div>
        </div>
    </div>

    <!-- Modální okno pro editaci sekce -->
    <div id="edit-modal" class="view-screen" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:10000; background:var(--bg-dark, #090D16); overflow-y:auto; padding: 16px;">
        <div class="view-header" style="position:sticky; top:0; background:var(--bg-dark, #090D16); padding-bottom:10px; z-index:10;">
            <button class="btn-back" onclick="closeEditModal()">← Zpět</button>
            <h2 id="edit-modal-title" style="font-size: 1rem; color: var(--brand-green-bright, #10B981);">Úprava sekce</h2>
            <button class="btn-close" onclick="closeEditModal()">✕</button>
        </div>
        <div id="edit-modal-body" style="padding-bottom: 40px;"></div>
    </div>

    <!-- Vynucení načtení čerstvého skriptu bez cache -->
    <script>
        document.write('<script src="js/firebase-config.js?v=' + Date.now() + '"><\/script>');
        document.write('<script src="js/data.js?v=' + Date.now() + '"><\/script>');
        document.write('<script src="js/admin.js?v=' + Date.now() + '"><\/script>');
    </script>
</body>
</html>
